[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "barley-gblup"
version = "0.1.0"
description = "Scikit-learn style GBLUP and article-inspired barley simulation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "threadpoolctl>=3.1",
]

[tool.setuptools]
packages = ["barley_gblup"]
